backend:
  name: git-gateway
  branch: staging

media_folder: "public/images"
public_folder: "/images"

# Make sure the publish mode is set to editorial_workflow
publish_mode: editorial_workflow

collections:
  - name: "meta"
    label: "Page Meta"
    label_singular: "Page Meta"
    delete: false
    editor:
      preview: false
    files:
      - label: "Page Meta Data"
        name: "pagemeta"
        file: "public/pagemeta.md"
        fields:
          - label: "Home Page"
            name: "home"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true, hint: "Home page title for SEO" }
              - { label: "Description", name: "description", widget: "markdown", required: true, pattern: ['.{120,500}', 'Description should be between 120-500 characters'] }
          
          - label: "About Page"
            name: "about"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true, hint: "About page title for SEO" }
              - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
          
          - label: "Gallery Page"
            name: "gallery"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true, hint: "Gallery page title for SEO" }
              - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
          
          - label: "Facilities Page"
            name: "facilities"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true, hint: "Facilities page title for SEO" }
              - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
          
          - label: "Blog Page"
            name: "blog"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true, hint: "Blog page title for SEO" }
              - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
          
          - label: "Contact Page"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true, hint: "Contact page title for SEO" }
              - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines (150-160 characters recommended)" }
          
          - label: "Rooms"
            name: "rooms"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true, hint: "Rooms page title for SEO" }
              - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
              
              - label: "Classic Rooms"
                name: "classic_rooms"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: true, hint: "Classic rooms page title for SEO" }
                  - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
                  
              - label: "Premium Rooms"
                name: "premium_rooms"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: true, hint: "Premium rooms page title for SEO" }
                  - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
              
              - label: "Deluxe Rooms"
                name: "deluxe_rooms"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: true, hint: "Deluxe rooms page title for SEO" }
                  - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
                  
              - label: "Deluxe Heritage Rooms"
                name: "deluxe_heritage_rooms"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: true, hint: "Deluxe heritage rooms page title for SEO" }
                  - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
          
          - label: "Wayanad Page"
            name: "wayanad"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true, hint: "Wayanad page title for SEO" }
              - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
          
          - label: "Tour Packages"
            name: "tourpackages"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true, hint: "Main tour packages page title for SEO" }
              - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
              
              - label: "Green Wayanad Tour Package"
                name: "green_wayanad_tour_package"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: true, hint: "Green Wayanad Tour Package title for SEO" }
                  - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
                  
              - label: "Vibrant Wayanad Tour Package"
                name: "vibrant_wayanad_tour_package"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: true, hint: "Vibrant Wayanad Tour Package title for SEO" }
                  - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }
                  
              - label: "Dream Wayanad Tour Package"
                name: "dream_wayanad_tour_package"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string", required: true, hint: "Dream Wayanad Tour Package title for SEO" }
                  - { label: "Description", name: "description", widget: "markdown", required: true, hint: "Brief description for search engines" }

  - name: "pages"
    label: "Pages"
    folder: "src/File"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "Heading", name: "heading", widget: "string", required: true }
      - { label: "Body", name: "body", widget: "markdown", required: true }
  
  - name: "blog"
    label: "Blog Posts"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - label: "SEO Settings"
        name: "seo"
        widget: "object"
        required: true
        fields:
          - { label: "Meta Title", name: "metaTitle", widget: "string", required: true, hint: "SEO optimized title for search results (required)" }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: true, hint: "SEO optimized description for search results (required)" }
      - { label: "Author", name: "author", widget: "string", required: true }
      - { label: "Date", name: "date", widget: "datetime", required: true }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Published", name: "published", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown", required: true }

  - name: "faqs"
    label: "FAQs"
    files:
      - file: "src/File/homefaqs.md"
        label: "Home Page FAQs"
        name: "home_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }
      - file: "src/File/aboutfaqs.md"
        label: "About Page FAQs"
        name: "about_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }
      - file: "src/File/roomsfaqs.md"
        label: "Rooms Page FAQs"
        name: "rooms_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }
      - file: "src/File/facilitiesfaqs.md"
        label: "Facilities Page FAQs"
        name: "facilities_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }
      - file: "src/File/wayanadfaqs.md"
        label: "Wayanad Page FAQs"
        name: "wayanad_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }
      - file: "src/File/generalfaqs.md"
        label: "General FAQ Component"
        name: "general_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }
      - file: "src/File/classicroomfaqs.md"
        label: "Classic Room FAQs"
        name: "classic_room_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }
      - file: "src/File/deluxeheritageroomfaqs.md"
        label: "Deluxe Heritage Room FAQs"
        name: "deluxe_heritage_room_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }
      - file: "src/File/deluxeroomfaqs.md"
        label: "Deluxe Room FAQs"
        name: "deluxe_room_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }
      - file: "src/File/premiumroomfaqs.md"
        label: "Premium Room FAQs"
        name: "premium_room_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }
      - file: "src/File/tourpackagesfaqs.md"
        label: "Tour Packages FAQs"
        name: "tour_packages_faqs"
        fields:
          - { name: "title", label: "Title", widget: "string" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "markdown" }
              - { label: "Answer", name: "answer", widget: "markdown" }

  - name: "rooms_page"
    label: "Rooms Page"
    files:
      - file: "src/File/roomspage.md"
        label: "Rooms Page Content"
        name: "rooms_page_content"
        fields:
          - label: "SEO Settings"
            name: "seo"
            widget: "object"
            fields:
              - { label: "Page Title", name: "title", widget: "string", required: true }
              - { label: "Meta Description", name: "description", widget: "text", required: true }
              - { label: "Keywords", name: "keywords", widget: "string", required: true }
              - { label: "Author", name: "author", widget: "string", required: true }
              - { label: "Twitter Site", name: "twitterSite", widget: "string", required: true }
              - { label: "OG Image", name: "ogImage", widget: "string", required: true }
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Background Image"
                name: "backgroundImage"
                widget: "image"
                required: true
              - { label: "Main Title", name: "title", widget: "string", required: true }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: true }
              - { label: "Overlay Opacity", name: "overlayOpacity", widget: "number", value_type: "float", min: 0, max: 1, step: 0.1, required: true }
          - label: "Rooms Introduction"
            name: "roomsIntro"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string", required: true }
              - { label: "Content", name: "content", widget: "markdown", required: true }
          - label: "Individual Rooms"
            name: "individualRooms"
            widget: "list"
            fields:
              - { label: "Room ID", name: "id", widget: "string", required: true }
              - { label: "Room Title", name: "title", widget: "string", required: true }
              - { label: "Description", name: "description", widget: "text", required: true }
              - label: "Room Image"
                name: "image"
                widget: "image"
                required: true
              - label: "Layout Type"
                name: "type"
                widget: "select"
                options: ["normal", "reverse"]
                required: true
              - { label: "Page Path", name: "path", widget: "string", required: true }

  - name: "wayanad_page"
    label: "Wayanad Page"
    files:
      - file: "src/File/wayanadpage.md"
        label: "Wayanad Page Content"
        name: "wayanad_page_content"
        fields:
          - { label: "Page Title", name: "title", widget: "string", required: true }
          - { label: "Meta Description", name: "description", widget: "text", required: true }
          - { label: "Keywords", name: "keywords", widget: "string", required: true }
          - { label: "Author", name: "author", widget: "string", required: true }
          - label: "Hero Background Image"
            name: "heroImage"
            widget: "image"
            required: true
          - { label: "Hero Title", name: "heroTitle", widget: "string", required: true }
          - label: "Attractions"
            name: "sections"
            widget: "list"
            fields:
              - { label: "Attraction Title", name: "title", widget: "string", required: true }
              - { label: "Description", name: "description", widget: "markdown", required: true }
              - label: "Attraction Image"
                name: "image"
                widget: "image"
                required: true
          - label: "Page Content"
            name: "body"
            widget: "markdown"
            required: true
